<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>API Subagents · 模型配置</title>
    <link rel="stylesheet" href="/config.css" />
    <script src="/config-ui.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">api subagents</div>
      <div class="aside-heading">已添加的连接</div>
      <nav id="models" class="models" aria-label="模型连接"></nav>
      <div class="sidebar-bottom">
        <details class="help">
          <summary>使用说明</summary>
          <p>添加连接并保存后，可将批量注释、机械修改等重复工作交给外部模型，由 Codex 做必要验收。</p>
        </details>
        <div class="local-note"><span class="local-dot"></span>配置保存在本机</div>
      </div>
    </aside>
    <main>
      <div class="content">
        <header class="page-header">
          <div>
            <h1>模型配置</h1>
            <p>把明确的重复工作交给外部模型，让 Codex 做必要验收。</p>
          </div>
          <button id="add" class="primary"><span aria-hidden="true">＋</span> 添加模型</button>
        </header>
        <div class="page-meta"><span id="model-count">0 个连接</span><span>支持多服务商混用</span></div>
        <section id="editor" aria-label="连接配置"></section>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <footer>
          <p>测试连接会发送一条简短请求，可能产生少量 API 费用。</p>
          <details>
            <summary>配置存储位置</summary>
            <code id="path">正在读取…</code>
          </details>
        </footer>
      </div>
    </main>
    <div id="model-menu" class="model-menu" popover="manual" role="menu" aria-label="连接操作">
      <button id="copy-model" role="menuitem" tabindex="-1">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="2" />
          <path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" />
        </svg>
        复制
      </button>
      <button id="delete-model" class="menu-danger" role="menuitem" tabindex="-1">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 5h14M8 3h4M5 5l1 12h8l1-12M8 8v6m4-6v6" />
        </svg>
        删除
      </button>
    </div>
    <dialog id="remove-dialog" aria-labelledby="remove-title" aria-describedby="remove-description">
      <form method="dialog">
        <h2 id="remove-title">删除模型配置？</h2>
        <p id="remove-description"></p>
        <div class="dialog-actions">
          <button class="secondary" value="cancel" autofocus>取消</button>
          <button class="primary danger" value="remove">确认删除</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
