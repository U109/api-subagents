<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="chat-svg-title chat-svg-desc">
  <title id="chat-svg-title">主对话接入：外部模型推理，Codex 执行工具</title>
  <desc id="chat-svg-desc">实线表示发出的请求，虚线表示返回的结果；图中不包含真实连接、模型配置或凭据。</desc>
  <defs><marker id="chat-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#526578" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1100" height="360" rx="12" fill="#ffffff"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#263445">
    <rect x="32" y="20" width="1036" height="48" rx="10" fill="#ffffff" stroke="#ffffff"/>
    <rect x="50" y="100" width="240" height="124" rx="10" fill="#edf5ff" stroke="#a9c5e8"/>
    <rect x="430" y="100" width="240" height="124" rx="10" fill="#f4f2ff" stroke="#c5bee4"/>
    <rect x="810" y="100" width="240" height="124" rx="10" fill="#edf8f2" stroke="#afd4bb"/>
    <rect x="32" y="262" width="1036" height="72" rx="10" fill="#f6f8fa" stroke="#d9e0e7"/>
    <path d="M296 142 L424 142" stroke="#526578" stroke-width="1.8" fill="none" marker-end="url(#chat-arrowhead)"/>
    <path d="M424 182 L296 182" stroke="#526578" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#chat-arrowhead)"/>
    <path d="M676 142 L804 142" stroke="#526578" stroke-width="1.8" fill="none" marker-end="url(#chat-arrowhead)"/>
    <path d="M804 182 L676 182" stroke="#526578" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#chat-arrowhead)"/>
    <text x="550" y="53" text-anchor="middle" font-size="24" font-weight="600" fill="#263445">主对话接入：外部模型推理，Codex 执行工具</text>
    <text x="170" y="144.5" text-anchor="middle" font-size="20" font-weight="600" fill="#263445">Codex 客户端</text>
    <text x="170" y="169.5" text-anchor="middle" font-size="20" font-weight="400" fill="#263445">对话权限 · 工具执行</text>
    <text x="170" y="194.5" text-anchor="middle" font-size="20" font-weight="400" fill="#263445">反馈工具结果并继续</text>
    <text x="550" y="144.5" text-anchor="middle" font-size="20" font-weight="600" fill="#263445">App 本机网关</text>
    <text x="550" y="169.5" text-anchor="middle" font-size="20" font-weight="400" fill="#263445">回环地址 · 随机令牌</text>
    <text x="550" y="194.5" text-anchor="middle" font-size="20" font-weight="400" fill="#263445">解析模型 · 适配协议</text>
    <text x="930" y="144.5" text-anchor="middle" font-size="20" font-weight="600" fill="#263445">外部模型 API</text>
    <text x="930" y="169.5" text-anchor="middle" font-size="20" font-weight="400" fill="#263445">使用指定连接与模型</text>
    <text x="930" y="194.5" text-anchor="middle" font-size="20" font-weight="400" fill="#263445">返回回答或工具调用</text>
    <text x="550" y="293.5" text-anchor="middle" font-size="18" font-weight="400" fill="#263445">工具调用回到 Codex 执行，工具结果再进入下一轮模型请求</text>
    <text x="550" y="316" text-anchor="middle" font-size="18" font-weight="400" fill="#263445">Responses 保留原协议流；其他接口通过本地 CPA SDK 转换</text>
    <rect x="324" y="130" width="72" height="24" rx="3" fill="#ffffff"/>
    <text x="360" y="148" text-anchor="middle" font-size="16" font-weight="400" fill="#526578">对话请求</text>
    <rect x="309.6" y="170" width="100.80000000000001" height="24" rx="3" fill="#ffffff"/>
    <text x="360" y="188" text-anchor="middle" font-size="16" font-weight="400" fill="#526578">回答 / 调用</text>
    <rect x="704" y="130" width="72" height="24" rx="3" fill="#ffffff"/>
    <text x="740" y="148" text-anchor="middle" font-size="16" font-weight="400" fill="#526578">模型请求</text>
    <rect x="704" y="170" width="72" height="24" rx="3" fill="#ffffff"/>
    <text x="740" y="188" text-anchor="middle" font-size="16" font-weight="400" fill="#526578">模型响应</text>
  </g>
</svg>
